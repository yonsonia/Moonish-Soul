/* Continuous soft light field: static radial paints, only transforms/opacity animate. */
body{isolation:isolate;background:#e6c9ee;background-image:none}

.light-orbit{position:absolute;left:50%;top:50%;width:266px;height:266px;border-radius:50%;pointer-events:none}
.orbit-front{z-index:3;transform:translate(-50%,-50%) rotate(-27deg) scaleY(.58)}
.orbit-back{z-index:1;width:238px;height:238px;transform:translate(-50%,-50%) rotate(55deg) scaleY(.7)}
.orbit-track{position:absolute;inset:0;border-radius:50%;border:1px solid #fff6ef99;border-top-color:#f3d8f3;animation:lightOrbit 21s linear infinite}
.orbit-back .orbit-track{animation-duration:29s;animation-direction:reverse;border-color:#d5b4d760;animation-delay:-11s}
.orbit-spark{position:absolute;left:50%;top:-7px;width:14px;height:14px;transform:translateX(-50%) scaleY(1.6);border-radius:50%;background:radial-gradient(circle,#fffef7 0%,#fff5c2 25%,#efc5e7a8 55%,transparent 76%);box-shadow:0 2px 13px #ffedbd9c}
.orbit-back .orbit-spark{background:radial-gradient(circle,#fffef7 0%,#ccfaf2 25%,#b4c4ed80 55%,transparent 76%);width:12px;height:12px}
@keyframes lightOrbit{to{transform:rotate(360deg)}}
@keyframes orbBreath{50%{transform:scale(1.045)}}
.page-hidden .orbit-track,.page-hidden .soul-orb,.ambient-paused .orbit-track,.ambient-paused .soul-orb{animation-play-state:paused}
/* Visually compact controls keep a 44px touch target. */
.primary{width:auto;max-width:100%;min-width:172px;min-height:44px;padding:11px 25px;font-size:13px;font-weight:500;letter-spacing:.3px;border-radius:9px;display:block;margin-inline:auto}
.setup .primary{margin-top:22px}.panel>.primary{max-width:280px;width:100%}.detail-footer .primary{max-width:260px;min-width:170px}
.ghost{font-size:11px;padding:7px 12px;border-radius:8px;min-height:44px}
.shuffle-step .shuffle-modes{max-width:290px;gap:9px}.shuffle-modes button,.shuffle-step .shuffle-modes button{min-height:48px;padding:8px 12px;font-size:12px;border-radius:9px}.shuffle-modes small,.shuffle-step .shuffle-modes small{font-size:10px;margin-top:2px}
.count-options{max-width:360px;margin-inline:auto}.count-options button{padding:10px 12px;min-height:54px;font-size:12px;border-radius:9px}.count-options small{font-size:10px}
.spread-options button{padding:12px 10px;border-radius:9px}.spread-options b{font-size:15px}.spread-options small{font-size:10px}
.controls{justify-content:center}.controls button{flex:0 1 auto;font-size:11px;padding:7px 12px}
@media(max-width:800px){.light-ritual{height:225px;margin-bottom:15px}.soul-orb{width:136px;height:136px}.primary{min-height:44px;padding:11px 24px;font-size:13px}.spread-options b{font-size:14px}.count-options button{min-height:54px}.face b{font-size:9px}.cross .face b{font-size:9px}.detail-card .face b{font-size:18px}.detail-card .face em{font-size:10px}}
@media(prefers-reduced-motion:reduce){.orbit-track,.soul-orb{animation:none!important}}

/* Quiet flow copy; a richer reading remains on the same page. */
.intro p:empty,.panel p:empty,.fan-note:empty{display:none}
.spread-count{text-align:center;margin:8px 0 16px!important;font-size:13px!important;color:var(--muted)}
.summary-lead{font:400 17px/1.95 'Noto Serif TC',serif;color:var(--ink);margin:24px 0 16px}
.summary-analysis{margin:22px 0 26px}
.summary-analysis h3,.summary-role-analysis h3{font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--plum);margin:24px 0 9px}
.summary-analysis p{font-size:14px;line-height:1.95;color:#625565;margin:9px 0 16px;overflow-wrap:anywhere}
.summary-role-analysis{border-top:1px solid var(--line);margin:24px 0 0;padding-top:0}
.summary-role-analysis>summary{cursor:pointer;color:var(--plum);font-size:13px;min-height:48px;padding:16px 0}
.summary-role-analysis article{padding:16px 0;border-top:1px solid var(--line)}
.summary-role-analysis h4{font-size:14px;font-weight:500;color:var(--ink);margin:0 0 10px;line-height:1.7}
.summary-role-analysis h4 small{display:block;color:var(--plum);font-size:11px;font-weight:400;margin-bottom:4px}
.summary-role-analysis p{font-size:14px;line-height:1.95;color:#625565;margin:9px 0;overflow-wrap:anywhere}
.summary-role-analysis .role-question{color:var(--plum)}
.summary-role-analysis button{padding:7px 0;min-height:44px;background:transparent;border:0;color:var(--plum);font-size:12px;text-decoration:underline;text-underline-offset:4px}
.summary-reflection .practice-source{font-size:11px;color:var(--muted);margin-top:0}
.summary-followthrough{font-size:13px;line-height:1.9;color:#625565}
@media(max-width:600px){.summary-lead{font-size:17px}.summary-analysis p,.summary-role-analysis p{font-size:14px}.summary-analysis h3{margin-top:22px}.reading-summary{padding:26px 22px}}

.summary-example{background:#eee5ee66;padding:12px 14px;border-radius:8px;font-size:14px;line-height:1.95;color:#625565}.summary-role-analysis .summary-example{padding:12px 14px}.summary-analysis h3{letter-spacing:0}

/* Two quiet entry points within the established Moonish Soul identity. */
body[data-screen="home"] .setup,body[data-screen="daily"] .setup{background:transparent;border:0;padding:0 8px;max-width:460px}
body[data-screen="home"] .intro,body[data-screen="daily"] .intro{margin-top:30px}
body[data-screen="home"] .intro h1,body[data-screen="daily"] .intro h1{font-size:clamp(25px,6.5vw,32px);letter-spacing:2px}
.home-entry .light-ritual{margin:25px auto 31px}
.entry-options{display:grid;gap:0;margin:0 auto 18px}
.entry-choice{display:flex;align-items:center;gap:17px;min-height:98px;width:100%;padding:20px 8px;border:0;border-bottom:1px solid #70566c40;border-radius:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer;transition:background .18s ease-out}
.entry-choice:hover{background:#faf6f05c}.entry-choice:focus-visible,.daily-card:focus-visible{outline:2px solid var(--plum,#70566c);outline-offset:5px}
.entry-choice b{display:block;font-size:18px;font-weight:500;letter-spacing:1px}.entry-choice small{display:block;font-size:13px;color:#625568;margin-top:7px;line-height:1.6}
.entry-moon{flex:0 0 34px;color:#70566c}.entry-moon .moon-icon{width:34px;height:34px}.entry-arrow{margin-left:auto;font-size:20px;color:#70566c}
.daily-entry{text-align:center}.daily-date{color:#625568;font-size:13px;margin:16px 0 24px;font-variant-numeric:tabular-nums}
.daily-card{position:relative;display:block;width:170px;height:260px;margin:0 auto;padding:0;background:transparent;border:0;border-radius:12px;cursor:pointer;color:var(--ink)}
.daily-card .face,.daily-card .cardback{position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box;border-radius:12px;overflow:hidden}
.daily-card .face{border:1px solid #70566c50;background:#faf6f0}.daily-card .face b{font-size:21px;bottom:17px;letter-spacing:2px}.daily-card .face em{font-size:12px}
.daily-card .cardback{display:flex;align-items:center;justify-content:center;background:#e9e0ed;border:1px solid #9b7ca3;color:#70566c;box-shadow:inset 0 0 0 9px #f7f0f8,inset 0 0 0 10px #b9a2be}
.daily-card .moon{position:static;transform:none;font-size:inherit}.daily-card .moon-icon{width:64px;height:64px}.daily-card-label{position:absolute;bottom:25px;font-size:13px;letter-spacing:2px}
.daily-status{font-size:14px;margin:24px 0 10px}.daily-note{font-size:12px;line-height:1.8;color:#625568;margin:0 0 18px}
.daily-dialog .position-remark{display:none}.daily-dialog #detailOrder{display:block}.daily-dialog #detailDone{width:auto;min-width:180px}
@media(max-width:500px){body[data-screen="home"] main,body[data-screen="daily"] main{padding-top:12px}.home-entry .light-ritual{margin-top:15px;margin-bottom:22px}.entry-choice{min-height:93px}.daily-card{width:156px;height:239px}}
.home-entry .light-ritual{overflow:clip;overflow-clip-margin:8px}

/* Tester feedback: preserve the identity, reduce competing text and actions. */
.logo-filter-defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.brand-crop{mix-blend-mode:normal;background:transparent}.brand-crop img{mix-blend-mode:normal;filter:url(#logoInk)}
.daily-dialog .detail-footer{display:none}.daily-dialog .detail-layout{padding-bottom:28px}
.shuffle-step .intro h1{font-size:24px;letter-spacing:1px}.shuffle-step .intro{margin-top:24px}
.shuffle-step .shuffle-modes{display:flex;max-width:340px;gap:0;border-bottom:1px solid var(--line);margin:0 auto}

.shuffle-step .shuffle-question textarea{min-height:124px;line-height:1.8;font-size:16px}

.daily-history-row:hover{background:#fffaf75c}.daily-history-row>span:last-child{margin-left:auto}.history-moon{width:28px;height:28px;color:var(--plum);flex-shrink:0}

@media(max-width:500px){.shuffle-step .intro{margin-top:22px}.shuffle-step .intro h1{font-size:23px}.shuffle-step #fullDeck{height:225px}.shuffle-step #fullDeck .decktap{height:220px}}

/* Comment round: ink logo, centered moon and a direct daily card choice. */
.brand-crop{transform:scale(.85);transform-origin:left center}.brand,.shuffle-step .brand{width:109px}
.daily-card .moon,.daily-pick .moon{display:grid;place-items:center;position:static;transform:none;width:64px;height:64px;color:var(--plum);text-shadow:none}
.daily-card .moon-icon,.daily-pick .moon-icon{display:block;width:100%;height:100%}
.daily-deck{display:flex;gap:12px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:16px 18px 24px;max-width:100%;scroll-padding:18px;scrollbar-color:#80647e80 transparent}
.daily-pick{position:relative;flex:0 0 112px;height:174px;padding:0;border:0;border-radius:10px;background:transparent;scroll-snap-align:start;color:var(--plum)}
.daily-pick .cardback{border-radius:10px;background:#e9e0ed;box-shadow:0 4px 9px #65436618;border:1px solid #927799}
.daily-pick .cardback:before{inset:7px;border:1px solid #b49cba;border-radius:5px}.daily-pick .moon{width:44px;height:44px}
.daily-pick-label{position:absolute;bottom:17px;font-size:8px;letter-spacing:1px;color:#70566c}.daily-pick:hover .cardback{background:#f0e7f2;border-color:#70566c}
.daily-pick:focus-visible{outline:2px solid var(--plum);outline-offset:4px}.daily-swipe{font-size:12px!important;margin:12px 0 0!important;color:#625568!important}
@media(max-width:800px){.brand-crop{transform:scale(.748)}.brand,.shuffle-step .brand{width:95px}}
@media(max-width:500px){.daily-deck{margin-inline:-8px;max-width:calc(100% + 16px);padding:16px 8px 24px;gap:10px;scroll-padding:8px}.daily-pick{flex-basis:104px;height:160px}}

const labels=['靜心','洗牌','牌數','牌陣','揀牌','開牌'];
const versions=[['a','A · 細緻月相','建議','清楚嘅圓弧，由新月慢慢走向滿月。最簡潔，細尺寸都易睇。'],['b','B · 柔光月相','','用淡淡珠光配月相，同背景光暈呼應，感覺柔和啲。'],['c','C · 軌道月相','','月相外加一條細軌道同光點，呼應首頁光球，圖案感強啲。']];
function icon(phase,variant,active){
 const lit=[0,.18,.5,.75,.93,1][phase],uid=variant+phase;
 const moon=lit===0?'':lit===1?'<circle cx="32" cy="32" r="20"/>':`<path d="M32 12 A20 20 0 0 1 32 52 ${lit===.5?'L32 12':`A${Math.abs(1-2*lit)*20} 20 0 0 ${lit<.5?0:1} 32 12`}Z"/>`;
 const tone=active?'#70566c':'#9b829d';
 const defs=variant==='b'?`<defs><radialGradient id="light-${uid}" cx="32%" cy="25%" r="80%"><stop stop-color="#fff8e7"/><stop offset=".48" stop-color="#d7c4e9"/><stop offset="1" stop-color="#8da9bd"/></radialGradient></defs>`:'';
 const orbit=variant==='c'?`<ellipse cx="32" cy="32" rx="29" ry="23" transform="rotate(-32 32 32)" fill="none" stroke="${tone}" stroke-width=".8"/><circle cx="55" cy="17" r="2.1" fill="${tone}"/>`:'';
 return `<svg viewBox="0 0 64 64" aria-hidden="true">${defs}${orbit}${variant==='b'?`<circle cx="32" cy="32" r="20" fill="#70566c" opacity=".22"/>`:''}${variant==='b'?`<circle cx="32" cy="32" r="25" fill="url(#light-${uid})" opacity="${active?.3:.15}"/>`:''}<circle cx="32" cy="32" r="20" fill="none" stroke="${tone}" stroke-width="${active?1.4:1}"/><g fill="${variant==='b'?`url(#light-${uid})`:tone}">${moon}</g>${variant==='b'&&lit>0?`<circle cx="32" cy="32" r="20" fill="none" stroke="${tone}" stroke-width="1"/>`:''}</svg>`;
}
function draw(){document.getElementById('options').innerHTML=versions.map(([v,title,tag,desc])=>`<section class="option option-${v}"><h2>${title}${tag?`<small>${tag}</small>`:''}</h2><p>${desc}</p><div class="phase-preview" role="group" aria-label="${title}，步驟效果">${labels.map((label,i)=>`<button data-variant="${v}" data-step="${i}" ${i===2?'aria-current="step"':''}>${icon(i,v,i===2)}<span>${label}</span></button>`).join('')}</div></section>`).join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const v=b.dataset.variant;document.querySelectorAll(`[data-variant="${v}"]`).forEach(s=>{const active=s===b;if(active)s.setAttribute('aria-current','step');else s.removeAttribute('aria-current');s.innerHTML=icon(+s.dataset.step,v,active)+`<span>${labels[+s.dataset.step]}</span>`})})}
draw();
